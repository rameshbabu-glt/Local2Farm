{% extends 'base.html' %}

{% block title %}Login - Local2Farm{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-l2f shadow-sm border-0">
                <div class="card-header bg-success text-white text-center py-3 rounded-top-3">
                    <h4 class="fw-bold mb-1"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Local2Farm</h4>
                    <small class="text-white-50">Select your account type to proceed</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <!-- Role Selector -->
                        <div class="mb-3">
                            <label for="role" class="form-label fw-bold">Login As:</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="farmer" {% if active_role == 'farmer' %}selected{% endif %}>🌾 Farmer</option>
                                <option value="admin" {% if active_role == 'admin' %}selected{% endif %}>🛡️ Administrator</option>
                            </select>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">Password:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-l2f btn-lg">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                            </button>
                        </div>
                    </form>

                    <!-- Quick Demo Credentials Loader -->
                    <div class="p-3 bg-light rounded-3 mt-3 border">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="small fw-bold text-success"><i class="bi bi-lightning-charge-fill"></i> Quick Demo Logins:</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-success flex-fill" id="fillFarmerDemo">
                                <i class="bi bi-person"></i> Fill Farmer
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" id="fillAdminDemo">
                                <i class="bi bi-shield-lock"></i> Fill Admin
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">Are you a new farmer?</span>
                        <a href="{{ url_for('auth.register') }}" class="fw-bold text-success text-decoration-none ms-1">
                            Register Here
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Farmer Profile - Local2Farm{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-l2f shadow-sm border-0">
                <div class="card-header bg-success text-white py-3 rounded-top-3">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-white text-success me-3" style="width: 44px; height: 44px;">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Farmer Profile</h4>
                            <small class="text-white-50">Manage your farm location and contact information</small>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('farmer.profile') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ farmer.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control bg-light" id="email" value="{{ farmer.email }}" readonly disabled>
                            <div class="form-text">Email address is your unique login ID and cannot be changed.</div>
                        </div>

                        <div class="mb-3">
                            <label for="mobile" class="form-label fw-bold">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobile" name="mobile" value="{{ farmer.mobile }}" required>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-md-4">
                                <label for="location" class="form-label fw-bold">Village / Hub</label>
                                <input type="text" class="form-control" id="location" name="location" value="{{ farmer.location }}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="district" class="form-label fw-bold">District</label>
                                <input type="text" class="form-control" id="district" name="district" value="{{ farmer.district }}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="state" class="form-label fw-bold">State</label>
                                <input type="text" class="form-control" id="state" name="state" value="{{ farmer.state }}" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-l2f btn-lg">
                                <i class="bi bi-save me-1"></i> Update Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

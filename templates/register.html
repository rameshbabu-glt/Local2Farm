{% extends 'base.html' %}

{% block title %}Farmer Registration - Local2Farm{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-l2f shadow-sm border-0">
                <div class="card-header bg-success text-white text-center py-3 rounded-top-3">
                    <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill me-2"></i>Farmer Registration</h4>
                    <small class="text-white-50">Join Local2Farm to get AI decision support for your crops</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row g-3">
                            <!-- Full Name -->
                            <div class="col-12">
                                <label for="name" class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Ramesh Kumar" value="{{ form_data.get('name', '') }}">
                            </div>

                            <!-- Mobile Number -->
                            <div class="col-md-6">
                                <label for="mobile" class="form-label fw-bold">Mobile Number <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="mobile" name="mobile" required placeholder="10-digit mobile number" value="{{ form_data.get('mobile', '') }}">
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-bold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com" value="{{ form_data.get('email', '') }}">
                            </div>

                            <!-- Password -->
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-bold">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Min 6 characters">
                            </div>

                            <!-- Confirm Password -->
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label fw-bold">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Re-type password">
                            </div>

                            <!-- Village / City -->
                            <div class="col-md-4">
                                <label for="location" class="form-label fw-bold">Village / City <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="location" name="location" required placeholder="e.g. Vijayawada" value="{{ form_data.get('location', '') }}">
                            </div>

                            <!-- District -->
                            <div class="col-md-4">
                                <label for="district" class="form-label fw-bold">District <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="district" name="district" required placeholder="e.g. Krishna" value="{{ form_data.get('district', '') }}">
                            </div>

                            <!-- State -->
                            <div class="col-md-4">
                                <label for="state" class="form-label fw-bold">State <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="state" name="state" required placeholder="e.g. Andhra Pradesh" value="{{ form_data.get('state', 'Andhra Pradesh') }}">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-l2f btn-lg">
                                <i class="bi bi-check2-circle me-1"></i> Complete Registration
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="{{ url_for('auth.login', role='farmer') }}" class="fw-bold text-success text-decoration-none ms-1">
                            Login here
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
